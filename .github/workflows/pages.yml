name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# cancel-in-progress MUST stay false — cancelling a mid-flight Pages deploy can wedge
# the github-pages environment (runs stay queued forever). GitHub starter uses false.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage public site (skip tools / CI noise)
        run: |
          mkdir -p _site
          # Copy only what the client site needs (keeps artifact small + fast).
          shopt -s dotglob
          for item in admin assets projects index.html project.html 404.html .nojekyll; do
            if [ -e "$item" ]; then cp -a "$item" _site/; fi
          done
          # Every project's clean-URL page /<slug>/ (slugs from projects/projects.json),
          # so new projects deploy without editing this workflow.
          for slug in $(python3 -c "import json;print(' '.join(p['slug'] for p in json.load(open('projects/projects.json'))['projects']))"); do
            case "$slug" in *[!a-z0-9-]*|'') continue;; esac
            if [ -f "$slug/index.html" ]; then cp -a "$slug" _site/; fi
          done
          ls _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
